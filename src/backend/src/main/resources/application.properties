spring.application.name=backend

# Config for database connection (PostgreSQL at Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coe}
spring.datasource.username=${DB_USER:coe}
spring.datasource.password=${DB_PASSWORD:coe}

# Flyway creates the tables; Hibernate only CHECKS that entities match them (and stops the app if not)
spring.jpa.hibernate.ddl-auto=validate
# Close the DB connection when the service method ends, not after the JSON is written
spring.jpa.open-in-view=false
# Nobody can ask for more than 50 items per page (protects the server)
spring.data.web.pageable.max-page-size=50

# Run the SQL files in db/migration (V1, V2, V3...) automatically on startup
spring.flyway.enabled=true

server.port=8080