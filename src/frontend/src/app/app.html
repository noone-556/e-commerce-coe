<!--
  The shell of the website (the template of app.ts). It is shown on EVERY page:
  header with logo and menu at the top, the current page in the middle, footer at the bottom.
-->
<header class="site-header">
  <div class="container header-inner">
    <!-- routerLink="/" = go to the home page WITHOUT reloading the whole website (a normal href would reload it) -->
    <a class="logo" routerLink="/">📚 Bookworm Corner</a>
    <nav>
      <!--
        routerLinkActive="active" = Angular adds the CSS class "active" to the link of the page you are on,
        so it is highlighted. [routerLinkActiveOptions]="exactPath" uses the rules from app.ts.
      -->
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="exactPath">Home</a>
      <a routerLink="/books" routerLinkActive="active" [routerLinkActiveOptions]="exactPath">Browse</a>
      <a routerLink="/books/new" routerLinkActive="active">Add a book</a>
    </nav>
  </div>
</header>

<main class="container">
  <!--
    An empty picture frame. The router puts the current page in here
    (Home, BookList, BookDetail or BookForm, depending on the URL - see app.routes.ts).
  -->
  <router-outlet />
</main>

<footer class="site-footer">
  <!-- The double curly brackets around "year" print the value of the year property from app.ts -->
  <div class="container">© {{ year }} Bookworm Corner · CoE Milestone 1</div>
</footer>
