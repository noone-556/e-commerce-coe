# nginx settings for the frontend container.
# nginx is the ONE front door of the app: the browser only ever talks to nginx.

server {
    listen 80;
    server_name _;

    # where the built angular files are (copied there by the Dockerfile)
    root /usr/share/nginx/html;
    index index.html;


    # Anything starting with /api/ is forwarded to the Spring Boot container.
    # "backend" is the service name in docker-compose.yml; Docker turns it into the container's address.
    # This does the same job as proxy.conf.json does during development.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }


    # Everything else: send the file if it exists (pictures, .js, .css).
    # If it doesn't exist (e.g. /books/5, which is an Angular page, not a file),
    # send index.html and let Angular's router show the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

}